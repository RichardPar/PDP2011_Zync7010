#User Configuration

#OE_TERMINAL = "tmux"

# force the PDP-11 reset helper into the rootfs
IMAGE_INSTALL:append = " pdp11-scripts"

# picocom - minimal serial terminal for the extra PDP-11 consoles on /dev/ttyUL*
IMAGE_INSTALL:append = " picocom"

# tu58fs - TU58 DECtape II emulator (github.com/RichardPar/tu58fs)
IMAGE_INSTALL:append = " tu58fs"

# pdp11-hostd - serves RL/RH disks (image files over UIO) and the XU
# network bridge ("virtual ESP32" over AXI, see docs/xu-networking-plan.md)
# from one process - replaces the earlier separate pdp11-diskd/pdp11-espd.
# Pulls in curl via RDEPENDS for its dlctl runtime disk image-swap client.
# Needs CONFIG_TUN (see bsp.cfg) for its tap device; brctl is already
# provided by busybox on this image (confirmed during the earlier
# from-scratch networking attempt, see memory [[xu-ethernet-bridge]]) - no
# bridge-utils package needed.
IMAGE_INSTALL:append = " pdp11-hostd"

# cppdecnet - DECnet Phase II/III/IV stack (github.com/RichardPar/cppdecnet),
# a C++ port of PyDECnet. Gives the PS its own DECnet node on the LAN the
# PDP-11 reaches through the XU bridge. Installs decnetd + dnping and the
# sample configs in /etc/decnet/samples; nothing auto-starts, since a node
# needs its area/node address assigned first.
IMAGE_INSTALL:append = " cppdecnet"

# libpcap - the Ethernet data link cppdecnet uses to put a DECnet circuit on a
# real segment rather than a simulated one. cppdecnet RDEPENDS on it, so RPM
# would pull it in anyway; it is named explicitly because this image has a
# history of it going missing (tcpdump was built against it and the .so had to
# be hand-copied to /usr/lib - see memory [[xu-ethernet-bridge]]). The kernel
# side needs nothing: AF_PACKET (CONFIG_PACKET=y) is already in the base
# zynq config, which is why that tcpdump worked.
IMAGE_INSTALL:append = " libpcap"
