#User Configuration

#OE_TERMINAL = "tmux"

# force the PDP-11 reset helper into the rootfs
IMAGE_INSTALL:append = " pdp11-scripts"

# picocom - minimal serial terminal for the extra PDP-11 consoles on /dev/ttyUL*
IMAGE_INSTALL:append = " picocom"

# tu58fs - TU58 DECtape II emulator (github.com/RichardPar/tu58fs)
IMAGE_INSTALL:append = " tu58fs"

# pdp11-diskd - serve the RL disk from an image file over UIO
# (pulls in curl via RDEPENDS, for its dlctl runtime image-swap client)
IMAGE_INSTALL:append = " pdp11-diskd"

# pdp11-netd - bridge the PDP-11's xu DEUNA ring engine (xuring.vhd AXI-Lite
# frame handoff) to a Linux tap device, bridged with eth0
# (pulls in bridge-utils via RDEPENDS, for its brctl bridge setup)
IMAGE_INSTALL:append = " pdp11-netd"
