# Enable the AXI UART Lite driver for the 3 extra PDP-11 consoles
# (Serial1/2/3 -> /dev/ttyUL0..2). Runs in polled mode (no fabric IRQ wired).
CONFIG_SERIAL_UARTLITE=y
CONFIG_SERIAL_UARTLITE_NR_UARTS=4
# not a Linux console, just raw terminal ports for the PDP-11
# CONFIG_SERIAL_UARTLITE_CONSOLE is not set

# UIO, for pdp11-diskd/pdp11-espd to reach their AXI-Lite bridges + interrupts
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y

# TUN/TAP, for pdp11-espd's tap0 device (see docs/xu-networking-plan.md) -
# not enabled by default on this kernel config, confirmed during the earlier
# from-scratch networking attempt (memory [[xu-ethernet-bridge]]: daemon
# failed immediately with "open /dev/net/tun: No such file or directory"
# until this was added)
CONFIG_TUN=y
