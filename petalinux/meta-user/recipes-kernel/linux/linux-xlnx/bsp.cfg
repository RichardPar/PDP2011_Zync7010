# Enable the AXI UART Lite driver for the 3 extra PDP-11 consoles
# (Serial1/2/3 -> /dev/ttyUL0..2). Runs in polled mode (no fabric IRQ wired).
CONFIG_SERIAL_UARTLITE=y
CONFIG_SERIAL_UARTLITE_NR_UARTS=4
# not a Linux console, just raw terminal ports for the PDP-11
# CONFIG_SERIAL_UARTLITE_CONSOLE is not set

# UIO, for pdp11-diskd to reach the sddisk AXI-Lite block device + its interrupt
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
